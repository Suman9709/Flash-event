services:
  db:
    image: postgres:16
    # Contains only POSTGRES_USER, POSTGRES_PASSWORD, and POSTGRES_DB.
    # This local file is ignored by Git; copy .docker.env.example to create it.
    env_file:
      - ./flash-result-system/.docker.env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  db_data:
  redis_data:
